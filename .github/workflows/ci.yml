name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read runtime versions
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          source deploy/runtime-versions.conf
          echo "node=${NODE_VERSION}" >>"${GITHUB_OUTPUT}"
          echo "npm=${NPM_VERSION}" >>"${GITHUB_OUTPUT}"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.runtime.outputs.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify bundled npm and build
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          node --version
          test "$(npm --version)" = "${{ steps.runtime.outputs.npm }}"
          npm ci
          npm run lint
          npm run build
          if grep -RIE \
            'localhost:8000|your_api_key_here|REPLACE_ON_SERVER' \
            dist; then
            echo "forbidden development or placeholder value in dist" >&2
            exit 1
          fi

  backend-python312:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read runtime versions
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          source deploy/runtime-versions.conf
          echo "python=${PYTHON_VERSION}" >>"${GITHUB_OUTPUT}"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ steps.runtime.outputs.python }}
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes \
            --requirement backend/requirements.lock
      - name: Run backend tests
        run: |
          python -m compileall -q backend deploy/scripts
          python -m unittest discover -s backend/tests -p 'test_*.py'

  backend-python313-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up compatibility Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Run compatibility tests
        run: |
          python -m pip install --require-hashes \
            --requirement backend/requirements.lock
          python -m unittest discover -s backend/tests -p 'test_*.py'

  deployment-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate scripts and templates
        run: |
          if git ls-files | grep -E \
            '(^|/)\.env$|\.htpasswd$|\.restic-password$|\.backup-credentials$|\.db(-wal|-shm)?$|\.pdf$|(^|/)data/uploads/'; then
            echo "tracked runtime secret or persistent data file detected" >&2
            exit 1
          fi
          bash -n deploy/scripts/*.sh
          python -m unittest discover -s deploy/tests -p 'test_*.py'

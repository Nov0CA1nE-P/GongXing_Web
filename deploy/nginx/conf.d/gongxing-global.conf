# 测试站与正式站共用的 HTTP 级日志和限流配置。
log_format gongxing_safe
    '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
    '$status $body_bytes_sent $request_time';

limit_req_zone $binary_remote_addr zone=gongxing_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=gongxing_upload:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=gongxing_ai:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=gongxing_write:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=gongxing_api:10m rate=600r/m;
limit_req_status 429;

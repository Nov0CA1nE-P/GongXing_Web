# 证书签发前使用。除了 ACME challenge 外，不提供网站内容。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name test.novocaine.me;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        add_header Retry-After "300" always;
        return 503 "test deployment is not ready\n";
    }
}

# 正式域名证书签发前与现有测试站并行使用。除了 ACME challenge 外，不提供内容。
server {
    listen 80;
    listen [::]:80;
    server_name gongxing.novocaine.me;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        add_header Retry-After "300" always;
        return 503 "public deployment is not ready\n";
    }
}

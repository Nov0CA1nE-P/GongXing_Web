# 本文件通过测试后安装到 /etc/nginx/sites-available/gongxing-test。
# Basic Auth 文件必须在首次启用本配置前由负责人逐用户生成。

log_format gongxing_safe
    '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
    '$status $body_bytes_sent $request_time';

limit_req_zone $binary_remote_addr zone=gongxing_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=gongxing_upload:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=gongxing_ai:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=gongxing_write:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=gongxing_api:10m rate=600r/m;
limit_req_status 429;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name test.novocaine.me;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://test.novocaine.me$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    access_log off;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test.novocaine.me;

    ssl_certificate /etc/letsencrypt/live/test.novocaine.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.novocaine.me/privkey.pem;

    root /opt/gongxing/current/frontend/dist;
    index index.html;
    server_tokens off;
    client_max_body_size 52m;
    client_body_timeout 60s;
    client_header_timeout 15s;
    keepalive_timeout 30s;

    auth_basic "Gongxing restricted test";
    auth_basic_user_file /etc/nginx/gongxing.htpasswd;

    access_log /var/log/nginx/gongxing_access.log gongxing_safe;
    error_log /var/log/nginx/gongxing_error.log warn;

    include /etc/nginx/snippets/gongxing-security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        text/css
        text/javascript;

    if (-f /run/gongxing/maintenance) {
        return 503;
    }
    error_page 503 = @gongxing_maintenance;

    location @gongxing_maintenance {
        default_type text/plain;
        include /etc/nginx/snippets/gongxing-security-headers.conf;
        add_header Retry-After "120" always;
        add_header Cache-Control "no-store" always;
        return 503 "scheduled maintenance; retry later\n";
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /api/admin/login {
        limit_req zone=gongxing_login burst=5 nodelay;
        include /etc/nginx/snippets/gongxing-proxy.conf;
    }

    location = /api/courseware/upload {
        limit_req zone=gongxing_upload burst=3 nodelay;
        include /etc/nginx/snippets/gongxing-proxy.conf;
    }

    location = /api/qanda/analyze-personality {
        limit_req zone=gongxing_ai burst=5 nodelay;
        include /etc/nginx/snippets/gongxing-proxy.conf;
    }

    location = /api/contact/submit {
        limit_req zone=gongxing_write burst=60 nodelay;
        include /etc/nginx/snippets/gongxing-proxy.conf;
    }

    location = /api/guestbook/messages {
        limit_req zone=gongxing_write burst=60 nodelay;
        include /etc/nginx/snippets/gongxing-proxy.conf;
    }

    location = /api/qanda/questions {
        limit_req zone=gongxing_write burst=60 nodelay;
        include /etc/nginx/snippets/gongxing-proxy.conf;
    }

    location = /api {
        limit_req zone=gongxing_api burst=200 nodelay;
        include /etc/nginx/snippets/gongxing-proxy.conf;
    }

    location ~ ^/api/(?:guestbook/messages/[0-9]+/react|qanda/answers/[0-9]+/like|qanda/questions/[0-9]+/follow-ups)$ {
        limit_req zone=gongxing_write burst=60 nodelay;
        include /etc/nginx/snippets/gongxing-proxy.conf;
    }

    location /api/ {
        limit_req zone=gongxing_api burst=200 nodelay;
        include /etc/nginx/snippets/gongxing-proxy.conf;
    }

    location = /data {
        include /etc/nginx/snippets/gongxing-proxy.conf;
    }

    location /data/ {
        include /etc/nginx/snippets/gongxing-proxy.conf;
    }

    location = /index.html {
        include /etc/nginx/snippets/gongxing-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        include /etc/nginx/snippets/gongxing-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
